[workspace]
members = [
    "crates/kardia-ble",
    "crates/kardia-cli",
    "crates/kardia-core",
]
resolver = "2"

[workspace.package]
authors = ["kardia-rs contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShaneBreazeale/kardia-rs"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
btleplug = "0.11"
clap = { version = "=4.5.51", features = ["derive"] }
futures = "0.3"
printpdf = { version = "0.7.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tract-onnx = "=0.21.17"
uuid = "=1.18.1"
